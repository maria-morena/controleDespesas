name: CI - Controle de Despesas

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Rodar Lint
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Rodar Testes
        run: php tests/testes.php

      - name: Testar categorização com IA (respostas simuladas)
        run: php tests/teste_categorizar.php

      - name: Executar teste de integração
        run: php tests/teste_integracao.php
